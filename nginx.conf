server {
  listen 80;
  server_name _;

  # Header-/Cookie-Limits erhöhen
  client_header_buffer_size 4k;
  large_client_header_buffers 4 32k;

  root /usr/share/nginx/html;
  index index.html;

  # Angular SPA: alle Pfade auf index.html umbiegen, falls keine Datei existiert
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: API-Proxy, falls dein Backend unter /api erreichbar sein soll
  # und z.B. im Docker-Netzwerk "backend" heißt.
  #
  # Passe die URL an deine tatsächliche Backend-Adresse an (host:port).
  location /api/ {
    proxy_pass http://host.docker.internal:58080;  # <- hier Backend-Service/Port eintragen
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}