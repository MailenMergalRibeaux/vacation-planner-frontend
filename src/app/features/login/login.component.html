<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">🏖️</span>
      <h1>Urlaubsplaner</h1>
      <p class="subtitle">Bitte melden Sie sich an</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="alert-error">{{ error }}</div>

      <div class="form-field">
        <label for="email">E-Mail</label>
        <input id="email" type="email" formControlName="email" placeholder="name@firma.de" autocomplete="username" />
        <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="field-error">
          <span *ngIf="form.get('email')?.errors?.['required']">Pflichtfeld</span>
          <span *ngIf="form.get('email')?.errors?.['email']">Bitte eine gültige E-Mail-Adresse eingeben.</span>
        </div>
      </div>

      <div class="form-field">
        <label for="passwort">Passwort</label>
        <input id="passwort" type="password" formControlName="passwort" placeholder="••••••••" autocomplete="current-password" />
        <div *ngIf="form.get('passwort')?.invalid && form.get('passwort')?.touched" class="field-error">
          Pflichtfeld
        </div>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading || form.invalid">
        <span *ngIf="isLoading">Anmelden…</span>
        <span *ngIf="!isLoading">Anmelden</span>
      </button>
    </form>

    <p class="hint">
      Noch kein Konto? <a routerLink="/register">Als Führungskraft registrieren →</a>
    </p>
  </div>
</div>
