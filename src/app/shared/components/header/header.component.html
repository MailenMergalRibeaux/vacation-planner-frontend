<header class="header">
  <div class="header-container">
    <div class="logo">
      <h1>
        <a routerLink="/">🏖️ Urlaubsplaner</a>
      </h1>
    </div>

    <nav class="nav" [class.open]="isMenuOpen">
      <ul class="nav-menu">
        <li class="nav-item">
          <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
        </li>
        <li class="nav-item">
          <a routerLink="/urlaubsantraege" routerLinkActive="active" (click)="closeMenu()">Urlaubsanträge</a>
        </li>
        <li class="nav-item">
          <a routerLink="/mitarbeiter" routerLinkActive="active" (click)="closeMenu()">Mitarbeiter</a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">
              Verwaltung
              <span *ngIf="currentMitarbeiter?.rolle === 'FUEHRUNGSKRAFT' && offeneGenehmigungenCount > 0"
                    class="badge-alert"
                    [ngStyle]="{ color: '#ff5252' }">
                  ({{ offeneGenehmigungenCount }})
              </span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="header-right">
      <div class="user-menu" *ngIf="currentMitarbeiter">
        <a routerLink="/passwort" class="user-name" title="Passwort ändern">
          {{ currentMitarbeiter.vorname }} {{ currentMitarbeiter.nachname }}
        </a>
        <button (click)="logout()" class="btn-logout">Abmelden</button>
      </div>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
